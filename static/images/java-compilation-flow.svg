<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" font-family="Segoe UI, Arial, sans-serif">
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#333">De code source à l'exécution</text>

  <!-- Fichier .java -->
  <rect x="20" y="70" width="120" height="70" rx="10" fill="#eaf3fb" stroke="#2f7fc1" stroke-width="2"/>
  <text x="50" y="100" font-size="14" font-weight="bold" fill="#1f4e73">Code.java</text>
  <text x="35" y="120" font-size="11" fill="#333">code source</text>

  <!-- Fleche 1 -->
  <line x1="140" y1="105" x2="185" y2="105" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="65" font-size="12" fill="#8a5a1e">javac (JDK)</text>

  <!-- Fichier .class -->
  <rect x="190" y="70" width="120" height="70" rx="10" fill="#fdf3e7" stroke="#e0821f" stroke-width="2"/>
  <text x="215" y="100" font-size="14" font-weight="bold" fill="#8a5a1e">Code.class</text>
  <text x="215" y="120" font-size="11" fill="#333">bytecode</text>

  <!-- Fleche 2 -->
  <line x1="310" y1="105" x2="355" y2="105" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="325" y="65" font-size="12" fill="#2f9e52">JVM (JRE)</text>

  <!-- JVM box -->
  <rect x="360" y="70" width="110" height="70" rx="10" fill="#e4f7e9" stroke="#2f9e52" stroke-width="2"/>
  <text x="390" y="100" font-size="14" font-weight="bold" fill="#1c5c33">JVM</text>
  <text x="378" y="120" font-size="11" fill="#333">interprète</text>

  <!-- Fleche 3 vers plateformes -->
  <line x1="470" y1="105" x2="510" y2="105" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Plateformes -->
  <rect x="515" y="30" width="160" height="40" rx="8" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="545" y="55" font-size="13" fill="#333">Windows</text>

  <rect x="515" y="85" width="160" height="40" rx="8" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="555" y="110" font-size="13" fill="#333">Mac</text>

  <rect x="515" y="140" width="160" height="40" rx="8" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
  <text x="550" y="165" font-size="13" fill="#333">Linux</text>

  <text x="20" y="210" font-size="13" fill="#333">Un même fichier .class (bytecode) peut être exécuté sur n'importe quelle plateforme</text>
  <text x="20" y="230" font-size="13" fill="#333">disposant d'une JVM : c'est le principe du "write once, run anywhere".</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
